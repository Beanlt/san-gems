name: san-gems-dayphang
# Loi DAY PHANG: moi ngay MOT lan, tran 60 phut.
# 🔴 Tach khoi san.yml ngay 11/09 vi no la con voi: keo nen 1.000 cay cho tung con trong ro,
#    moi cu gian 2,2-3,5 giay, cong 15 giay nghi moi lan GeckoTerminal tra 429.

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: san-gems-dayphang
  cancel-in-progress: false

jobs:
  dayphang:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Chay SAN.py (DAY PHANG)
        run: bash chay.sh dayphang

      - name: Ghi ket qua vao repo
        if: always()
        run: |
          git config user.name  "san-gems bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          git add -A
          git diff --staged --quiet && echo "khong co gi moi" && exit 0
          git commit -m "quet dayphang $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
