name: san-gems
# MOT loi duy nhat, BON VE (SCRIPT.md v5 · LUAT.md v8, Bean chot 12/09).
# Ba loi cu NGUOC / NO LAI / DAY PHANG da gop lam mot — khong con workflow rieng.

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: san-gems
  cancel-in-progress: false

jobs:
  quet:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Chay SAN.py
        run: bash chay.sh

      - name: Ghi ket qua vao repo
        if: always()
        run: |
          git config user.name  "san-gems bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          git add -A
          git diff --staged --quiet && echo "khong co gi moi" && exit 0
          git commit -m "quet $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
