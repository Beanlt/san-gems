name: san-gems
# Lo NHANH: NGUOC + NO LAI, moi 3 gio. Chay DUNG SAN.py — mot ban code duy nhat.
# 🔴 VA 11/09: DAY PHANG da tach sang workflow rieng (dayphang.yml). Luot dau tien chay
#    ca ba loi het 20m27s tren tran 30m — cham tran thi job bi huy, KHONG commit gi,
#    moc .dayphang_ khong duoc ghi, luot sau lai chay lai tu dau: vong lap chet.

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: san-gems
  cancel-in-progress: false

jobs:
  quet:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Chay SAN.py (NGUOC + NO LAI)
        run: bash chay.sh nhanh

      - name: Ghi ket qua vao repo
        if: always()
        run: |
          git config user.name  "san-gems bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          git add -A
          git diff --staged --quiet && echo "khong co gi moi" && exit 0
          git commit -m "quet nhanh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
